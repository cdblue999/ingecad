name: Windows 11 Rust App Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag wydania (np. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches: [ "main", "master", "dev-windows-opt" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  converters:
    name: LibreDWG for win64 (mingw)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 make curl
      - name: Cross-build the patched converters
        run: tools/libredwg-patches/build-vendor-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libredwg-win64
          path: vendor/libredwg/win64/*.exe
          if-no-files-found: error
          retention-days: 7

  build-windows-app:
    name: Build Windows Application
    needs: converters
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 1. Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 3. Pobranie konwerterów LibreDWG dla win64
        uses: actions/download-artifact@v4
        with:
          name: libredwg-win64
          path: vendor/libredwg/bin

      - name: 4. Instalacja zależności IngeCAD
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 5. Konfiguracja kompilatora Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 6. Przygotowanie i kompilacja Launchera w Rust
        shell: pwsh
        run: |
          # Inicjalizacja projektu Rust w podfolderze wrapper
          cargo new --bin ingecad-runner
          Set-Location ingecad-runner

          # Kod wrappera w Rust (uruchamia silnik CAD w odizolowanym procesie)
          @'
          use std::process::Command;
          use std::env;

          fn main() {
              let current_dir = env::current_exe()
                  .ok()
                  .and_then(|p| p.parent().map(|p| p.to_path_buf()))
                  .unwrap_or_else(|| std::path::PathBuf::from("."));

              let app_path = current_dir.join("internal").join("IngeCAD_Engine.exe");

              let status = Command::new(&app_path)
                  .args(env::args().skip(1))
                  .current_dir(&current_dir)
                  .status();

              match status {
                  Ok(code) => std::process::exit(code.code().unwrap_or(0)),
                  Err(e) => {
                      eprintln!("Błąd uruchamiania silnika CAD: {}", e);
                      std::process::exit(1);
                  }
              }
          }
          '@ | Out-File -Encoding utf8 src/main.rs

          # Kompilacja wydania zoptymalizowanego
          cargo build --release --target x86_64-pc-windows-msvc
          Set-Location ..

      - name: 7. Budowanie i pakowanie aplikacji pod Windows 11
        shell: pwsh
        run: |
          # Zamrożenie silnika aplikacji CAD do postaci wykonywalnej wraz z zasobami
          pyinstaller --noconfirm --onedir --windowed --name "IngeCAD_Engine" `
            --add-data "resources;resources" `
            --add-data "i18n;i18n" `
            --add-data "plugins;plugins" `
            main.py

          # Przygotowanie kompletnej struktury dystrybucyjnej dla użytkownika
          New-Item -ItemType Directory -Force -Path dist_package
          New-Item -ItemType Directory -Force -Path dist_package/internal
          New-Item -ItemType Directory -Force -Path dist_package/internal/vendor/libredwg/bin

          # Skopiowanie plików silnika, wtyczek i zasobów
          Copy-Item -Path "dist/IngeCAD_Engine/*" -Destination "dist_package/internal" -Recurse
          Copy-Item -Path "plugins" -Destination "dist_package/internal/plugins" -Recurse
          Copy-Item -Path "resources" -Destination "dist_package/internal/resources" -Recurse
          Copy-Item -Path "i18n" -Destination "dist_package/internal/i18n" -Recurse
          if (Test-Path "extensions") {
              Copy-Item -Path "extensions" -Destination "dist_package/internal/extensions" -Recurse
          }

          # Skopiowanie konwerterów DWG/DXF (LibreDWG) dla obsługi DWG XREF i BIND na Windows
          if (Test-Path "vendor/libredwg/bin") {
              Copy-Item -Path "vendor/libredwg/bin/*" -Destination "dist_package/internal/vendor/libredwg/bin" -Recurse
          }
          
          # Skopiowanie binarnego launchera Rust jako głównego pliku .exe
          Copy-Item "ingecad-runner/target/x86_64-pc-windows-msvc/release/ingecad-runner.exe" -Destination "dist_package/IngeCAD.exe"

          # Spakowanie do archiwum ZIP
          Compress-Archive -Path dist_package/* -DestinationPath IngeCAD-Windows-x64.zip -Force

      - name: 8. Zapisanie artefaktu (dostępny przez 7 dni w Actions)
        uses: actions/upload-artifact@v4
        with:
          name: IngeCAD-Windows-x64
          path: IngeCAD-Windows-x64.zip
          retention-days: 7

      - name: 9. Publikacja do GitHub Releases (dla uruchomień ręcznych i tagów)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "IngeCAD Windows 11 (${{ github.event.inputs.release_tag || github.ref_name }})"
          draft: false
          prerelease: false
          files: IngeCAD-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
