name: Windows 11 Rust App Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag wydania (np. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-windows-app:
    runs-on: windows-latest

    steps:
      - name: 1. Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 3. Instalacja zależności IngeCAD
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 4. Konfiguracja kompilatora Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 5. Przygotowanie i kompilacja Launchera w Rust
        shell: pwsh
        run: |
          # Inicjalizacja projektu Rust w podfolderze wrapper
          cargo new --bin ingecad-runner
          Set-Location ingecad-runner

          # Kod wrappera w Rust (uruchamia silnik CAD w odizolowanym procesie)
          @'
          use std::process::Command;
          use std::env;

          fn main() {
              let current_dir = env::current_exe()
                  .ok()
                  .and_then(|p| p.parent().map(|p| p.to_path_buf()))
                  .unwrap_or_else(|| std::path::PathBuf::from("."));

              let app_path = current_dir.join("internal").join("IngeCAD_Engine.exe");

              let status = Command::new(&app_path)
                  .args(env::args().skip(1))
                  .current_dir(&current_dir)
                  .status();

              match status {
                  Ok(code) => std::process::exit(code.code().unwrap_or(0)),
                  Err(e) => {
                      eprintln!("Błąd uruchamiania silnika CAD: {}", e);
                      std::process::exit(1);
                  }
              }
          }
          '@ | Out-File -Encoding utf8 src/main.rs

          # Kompilacja wydania zoptymalizowanego
          cargo build --release --target x86_64-pc-windows-msvc
          Set-Location ..

      - name: 6. Budowanie i pakowanie aplikacji pod Windows 11
        shell: pwsh
        run: |
          # Zamrożenie silnika aplikacji CAD do postaci wykonywalnej
          pyinstaller --noconfirm --onedir --windowed --name "IngeCAD_Engine" main.py

          # Przygotowanie struktury dystrybucyjnej dla użytkownika
          New-Item -ItemType Directory -Force -Path dist_package
          New-Item -ItemType Directory -Force -Path dist_package/internal

          # Skopiowanie plików silnika i zasobów
          Copy-Item -Path "dist/IngeCAD_Engine/*" -Destination "dist_package/internal" -Recurse
          
          # Skopiowanie binarnego launchera Rust jako głównego pliku .exe
          Copy-Item "ingecad-runner/target/x86_64-pc-windows-msvc/release/ingecad-runner.exe" -Destination "dist_package/IngeCAD.exe"

          # Spakowanie do archiwum ZIP
          Compress-Archive -Path dist_package/* -DestinationPath IngeCAD-Windows-x64.zip -Force

      - name: 7. Zapisanie artefaktu (dostępny przez 7 dni w Actions)
        uses: actions/upload-artifact@v4
        with:
          name: IngeCAD-Windows-x64
          path: IngeCAD-Windows-x64.zip
          retention-days: 7

      - name: 8. Publikacja do GitHub Releases (dla uruchomień ręcznych)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'latest' }}
          name: "IngeCAD Windows 11 (${{ github.event.inputs.release_tag || 'latest' }})"
          draft: false
          prerelease: false
          files: IngeCAD-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
