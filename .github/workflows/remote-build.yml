name: Windows Build Service

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Nazwa wydania'
        required: false
        default: 'v1.0.0'
  push:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Konfiguracja kompilatora MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalacja środowiska Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: ${{ runner.temp }}

      - name: Konfiguracja i kompilacja (CMake + Ninja)
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build build --config Release --parallel

      - name: Pakowanie aplikacji z bibliotekami DLL (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType
